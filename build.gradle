import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'base'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'com.diffplug.spotless' version '8.10.2' apply false
    id 'com.github.spotbugs' version '6.5.13' apply false
}

allprojects {
    group = 'com.tomo'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

tasks.register('configureGitHookJava', Exec) {
    description = 'TOMO 커밋 검사에 사용할 Gradle JVM 경로 저장'
    workingDir rootDir
    commandLine 'git', 'config', '--local', 'tomo.hookJavaHome', System.getProperty('java.home')
}

tasks.register('installGitHooks', Exec) {
    dependsOn tasks.named('configureGitHookJava')
    group = 'build setup'
    description = 'TOMO 저장소의 커밋 전 자동 검사 훅 활성화'
    workingDir rootDir
    commandLine 'git', 'config', '--local', 'core.hooksPath', '.githooks'
    doFirst {
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            if (!file('.githooks/pre-commit').setExecutable(true, false)) {
                throw new GradleException('Could not make pre-commit hook executable')
            }
        }
    }
}

subprojects {

    pluginManager.withPlugin('java') {
        def javaProject = project
        dependencies {
            implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
        }
        apply from: rootProject.file('gradle/quality.gradle')
        spotbugs {
            toolVersion = '4.10.5'
            ignoreFailures = false
            effort = Effort.valueOf('MAX')
            reportLevel = Confidence.valueOf('MEDIUM')
        }
        tasks.withType(SpotBugsTask).configureEach {
            reports {
                html.required = true
                xml.required = true
            }
        }
        rootProject.tasks.named('check') {
            dependsOn javaProject.tasks.named('check')
        }
        rootProject.tasks.named('assemble') {
            dependsOn javaProject.tasks.named('assemble')
        }
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }
}

def coverageProp = providers.gradleProperty('coverage').orNull
if (coverageProp != null && !['true', 'false'].contains(coverageProp.toLowerCase())) {
    throw new GradleException("coverage 속성값은 'true' 또는 'false'여야 합니다. (입력값: '${coverageProp}')")
}

if (coverageProp?.toBoolean() ?: false) {
    tasks.register('jacocoRootCoverageVerification') {
        group = 'verification'
        description = 'JaCoCo 전체 모듈 커버리지 검증 (라인 80%, 조건 분기 55%)'
        dependsOn subprojects.collect { p -> p.tasks.matching { t -> t.name == 'jacocoTestReport' } }

        doLast {
            def totals = [LINE: [0, 0], BRANCH: [0, 0]]
            def missingReportModules = []

            subprojects.findAll { p -> p.pluginManager.hasPlugin('java') }.each { p ->
                def reportFile = p.layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile
                if (reportFile.exists()) {
                    def xml = reportFile.text
                    def lastPkg = xml.lastIndexOf('</package>')
                    def lastGrp = xml.lastIndexOf('</group>')
                    def idx = Math.max(lastPkg >= 0 ? lastPkg + 10 : 0, Math.max(lastGrp >= 0 ? lastGrp + 8 : 0, xml.indexOf('>') + 1))
                    def rootCounters = xml.substring(idx)

                    def matcher = rootCounters =~ /<counter\b([^>]*?)\/?>/
                    while (matcher.find()) {
                        def attrString = matcher.group(1)
                        def typeMatch = attrString =~ /type="([^"]*)"/
                        def missedMatch = attrString =~ /missed="([^"]*)"/
                        def coveredMatch = attrString =~ /covered="([^"]*)"/
                        if (typeMatch.find() && missedMatch.find() && coveredMatch.find()) {
                            def type = typeMatch.group(1)
                            if (type in ['LINE', 'BRANCH']) {
                                totals[type][0] += missedMatch.group(1).toInteger()
                                totals[type][1] += coveredMatch.group(1).toInteger()
                            }
                        }
                    }
                } else {
                    def hasProductionClasses = p.sourceSets.main.output.classesDirs.any { dir ->
                        dir.exists() && !fileTree(dir).matching { include '**/*.class'; exclude '**/package-info.class' }.empty
                    }
                    if (hasProductionClasses) {
                        missingReportModules.add(p.path)
                    }
                }
            }

            if (!missingReportModules.isEmpty()) {
                throw new GradleException("JaCoCo 커버리지 보고서가 누락된 모듈이 존재합니다: " + missingReportModules.join(', '))
            }

            def lineTotal = totals.LINE[0] + totals.LINE[1]
            def linePct = lineTotal > 0 ? (100.0 * totals.LINE[1] / lineTotal) : 0.0
            def branchTotal = totals.BRANCH[0] + totals.BRANCH[1]
            def branchPct = branchTotal > 0 ? (100.0 * totals.BRANCH[1] / branchTotal) : 0.0

            def minLine = 80.0
            def minBranch = 55.0

            logger.lifecycle(String.format("📊 JaCoCo 전체 커버리지 결과: 코드 줄 %.2f%% (기준: %.1f%%), 조건 분기 %.2f%% (기준: %.1f%%)",
                    linePct, minLine, branchPct, minBranch))

            def violations = []
            if (linePct < minLine) {
                violations.add(String.format("코드 줄(LINE) 커버리지 미달: %.2f%% < %.1f%%", linePct, minLine))
            }
            if (branchPct < minBranch) {
                violations.add(String.format("조건 분기(BRANCH) 커버리지 미달: %.2f%% < %.1f%%", branchPct, minBranch))
            }

            if (!violations.isEmpty()) {
                throw new GradleException("JaCoCo 최소 커버리지 기준 미달:\n - " + violations.join("\n - "))
            }
        }
    }

    tasks.register('jacocoTestCoverageVerification') {
        group = 'verification'
        description = 'JaCoCo 전체 모듈 커버리지 검증 태스크'
        dependsOn tasks.named('jacocoRootCoverageVerification')
    }

    tasks.named('check') {
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }
}
