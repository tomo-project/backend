name: 🧪 CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🧪 검사 및 실행 JAR 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 📥 소스 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: ☕ Java 21 준비
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 🐳 Testcontainers용 Docker 확인
        run: docker info

      - name: 🧪 테스트·품질 검사·커버리지 및 실행 JAR 빌드
        run: bash gradlew --no-daemon -Pcoverage=true check jacocoTestReport :apps:api:bootJar

      - name: 📦 배포 결과물 구성
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp apps/api/build/libs/tomo-service.jar artifact/tomo-service.jar
          printf '%s\n' "$COMMIT_SHA" > artifact/COMMIT_SHA
          (cd artifact && sha256sum tomo-service.jar > SHA256SUMS)

      - name: 📤 검증된 실행 JAR 보관
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tomo-service-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: 📋 검사 보고서 보관
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: check-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/api/build/reports/
            integrations/*/build/reports/
          if-no-files-found: ignore
          retention-days: 7
