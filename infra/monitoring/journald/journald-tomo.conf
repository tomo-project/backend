# TOMO 개발 서버 systemd journal 용량 및 보관 정책
# 위치: /etc/systemd/journald.conf.d/tomo.conf
# 목적: Micro 서버의 제한된 디스크 공간 보호 및 로그 과다 축적 방지

[Journal]
Storage=persistent

# 저널 로그가 사용할 수 있는 최대 디스크 용량 (기본값 수 GB 방지 -> 200MB 제한)
SystemMaxUse=200M

# 단일 저널 파일의 최대 크기
SystemMaxFileSize=50M

# 로그 최대 보관 기간 (7일이 지난 로그는 자동 순환 및 삭제)
MaxRetentionSec=7day

# 비정상적인 로그 폭증 시 시스템 보호를 위한 버스트 제한
RateLimitIntervalSec=30s
RateLimitBurst=10000
