apply plugin: 'checkstyle'
apply plugin: 'com.diffplug.spotless'
apply plugin: 'com.github.spotbugs'

spotless {
    lineEndings 'UNIX'
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.28.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '14.0.0'
    configDirectory = rootProject.layout.projectDirectory.dir('config/checkstyle')
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    reports {
        html.required = true
        xml.required = true
    }
}

def coverageProp = providers.gradleProperty('coverage').orNull
if (coverageProp != null && !['true', 'false'].contains(coverageProp.toLowerCase())) {
    throw new GradleException("coverage 속성값은 'true' 또는 'false'여야 합니다. (입력값: '${coverageProp}')")
}

if (coverageProp?.toBoolean() ?: false) {
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = '0.8.13'
    }

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports {
            html.required = true
            xml.required = true
            csv.required = false
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}
