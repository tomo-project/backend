spring:
  application:
    name: tomo-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      connect-timeout: 3s
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    connection-timeout: 5s

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED}
    path: /v3/api-docs

scalar:
  enabled: ${OPENAPI_ENABLED}
  url: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS}
  endpoint:
    health:
      show-details: never
