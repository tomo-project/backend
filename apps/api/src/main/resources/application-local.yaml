spring:
  application:
    name: tomo-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      connect-timeout: 3s
      timeout: 3s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        pool:
          enabled: true
          max-active: 4
          max-idle: 2
          min-idle: 0
          max-wait: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    connection-timeout: 5s
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    cache:
      channel:
        size: 10
    template:
      retry:
        enabled: true
        initial-interval: 1s
        max-interval: 10s
        multiplier: 2.0
        max-attempts: 3

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED}
    path: /v3/api-docs

scalar:
  enabled: ${OPENAPI_ENABLED}
  url: /v3/api-docs

tomo:
  redis:
    redisson:
      enabled: true
      connection-pool-size: 4
      connection-minimum-idle-size: 1
      subscription-connection-pool-size: 2
      subscription-connection-minimum-idle-size: 1

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS}
  endpoint:
    health:
      show-details: never
